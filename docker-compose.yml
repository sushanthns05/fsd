version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: edusphere-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: edusphere
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: edusphere-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/edusphere
      - JWT_SECRET=super_production_edusphere_jwt_secret_key_982374
      - JWT_REFRESH_SECRET=super_production_refresh_secret_872364
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: edusphere-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
  server_uploads:
